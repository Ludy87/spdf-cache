name: Prime Gradle Cache

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  node-cache-prime:
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime node cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository q
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # - name: Restore node cache
      #   id: cache-node-restore
      #   uses: Ludy87/cache-the-planet@v1
      #   with:
      #     repository: Ludy87/spdf-cache
      #     encryption-key: ${{ secrets.CACHE_APP_TOKEN }}
      #     path: .cache/npm
      #     cache-name: npm
      #     key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('frontend/package-lock.json')) }}
      #     token: ${{ secrets.CACHE_APP_TOKEN }}

      - name: Report node cache result
        run: |
          echo "Exact hit: ${{ steps.cache-node-restore.outputs.cache-hit }}"
          echo "Matched key: ${{ steps.cache-node-restore.outputs.matched-key }}"
          echo "Object: ${{ steps.cache-node-restore.outputs.content-hash }}"

      - name: Set up Node.js
        if: ${{ steps.cache-node-restore.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Prepare npm cache directory
        if: ${{ steps.cache-node-restore.outputs.cache-hit != 'true' }}
        run: |
          echo "npm cache: $(npm config get cache)"
          mkdir -p "$NPM_CONFIG_CACHE"

      - name: Install frontend dependencies
        if: ${{ steps.cache-node-restore.outputs.cache-hit != 'true' }}
        working-directory: frontend
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: npm ci --ignore-scripts --audit=false --fund=false

      # - name: Save node cache
      #   if: >-
      #     success() && steps.cache-node-restore.outputs.cache-hit != 'true' &&
      #     (github.event_name != 'pull_request' ||
      #      github.event.pull_request.head.repo.full_name == github.repository)
      #   uses: Ludy87/cache-the-planet/save@v1
      #   with:
      #     repository: Ludy87/spdf-cache
      #     path: .cache/npm
      #     cache-name: npm
      #     key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('frontend/package-lock.json')) }}
      #     encryption-key: ${{ secrets.CACHE_APP_TOKEN }}
      #     token: ${{ secrets.CACHE_APP_TOKEN }}
      #     exclude: |
      #       **/.env
      #       **/*.pem
      #       **/*credentials*

  uv-cache-prime:
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime uv cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/uv-python
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository 6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # - name: Restore uv cache
      #   id: cache-uv-restore
      #   uses: Ludy87/cache-the-planet@v1
      #   with:
      #     repository: Ludy87/spdf-cache
      #     encryption-key: ${{ secrets.CACHE_APP_TOKEN }}
      #     path: |
      #       .cache/uv
      #       .cache/uv-python
      #     cache-name: uv
      #     key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('engine/pyproject.toml', 'engine/uv.lock')) }}
      #     token: ${{ secrets.CACHE_APP_TOKEN }}

      - name: Report uv cache result
        run: |
          echo "Exact hit: ${{ steps.cache-uv-restore.outputs.cache-hit }}"
          echo "Matched key: ${{ steps.cache-uv-restore.outputs.matched-key }}"
          echo "Object: ${{ steps.cache-uv-restore.outputs.content-hash }}"

      - name: Install uv
        if: steps.cache-uv-restore.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: false
          download-from-astral-mirror: false

      - name: Prime uv dependencies
        if: steps.cache-uv-restore.outputs.cache-hit != 'true'
        run: uv sync --project engine --locked --group tools

      # - name: Save uv cache
      #   if: >-
      #     success() && steps.cache-uv-restore.outputs.cache-hit != 'true' &&
      #     (github.event_name != 'pull_request' ||
      #      github.event.pull_request.head.repo.full_name == github.repository)
      #   uses: Ludy87/cache-the-planet/save@v1
      #   with:
      #     repository: Ludy87/spdf-cache
      #     encryption-key: ${{ secrets.CACHE_APP_TOKEN }}
      #     path: |
      #       .cache/uv
      #       .cache/uv-python
      #     cache-name: uv
      #     key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('engine/pyproject.toml', 'engine/uv.lock')) }}
      #     token: ${{ secrets.CACHE_APP_TOKEN }}
      #     exclude: |
      #       **/.env
      #       **/*.pem
      #       **/*credentials*

  unoserver-image-cache-prime:
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime unoserver image cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILDX_CACHE: ${{ github.workspace }}/.cache/buildx/unoserver
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # - name: Restore Buildx cache
      #   id: cache-buildx-restore
      #   uses: Ludy87/cache-the-planet@v1
      #   with:
      #     repository: Ludy87/spdf-cache
      #     encryption-key: ${{ secrets.CACHE_APP_TOKEN }}
      #     path: .cache/buildx/unoserver
      #     cache-name: buildx-unoserver
      #     key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('docker/unoserver/Dockerfile', 'docker/unoserver/fonts.conf', 'docker/unoserver/entrypoint.sh', 'docker/unoserver/healthcheck.sh', '.dockerignore')) }}
      #     token: ${{ secrets.CACHE_APP_TOKEN }}

      - name: Report Buildx cache result
        run: |
          echo "Exact hit: ${{ steps.cache-buildx-restore.outputs.cache-hit }}"
          echo "Matched key: ${{ steps.cache-buildx-restore.outputs.matched-key }}"
          echo "Object: ${{ steps.cache-buildx-restore.outputs.content-hash }}"

      - name: Prepare Buildx cache directory
        if: steps.cache-buildx-restore.outputs.cache-hit != 'true'
        run: mkdir -p .cache/buildx/unoserver

      - name: Set up QEMU
        if: steps.cache-buildx-restore.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: steps.cache-buildx-restore.outputs.cache-hit != 'true'
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build docker/unoserver/Dockerfile
        if: steps.cache-buildx-restore.outputs.cache-hit != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./docker/unoserver/Dockerfile
          push: false
          load: true
          cache-from: |
            type=local,src=.cache/buildx/unoserver
          cache-to: |
            type=local,dest=.cache/buildx/unoserver-new,mode=max
          platforms: linux/amd64
          tags: stirling-unoserver:pr-test
          provenance: false
          sbom: false

      - name: Promote Buildx cache
        if: success() && steps.cache-buildx-restore.outputs.cache-hit != 'true'
        run: |
          rm -rf .cache/buildx/unoserver
          mv .cache/buildx/unoserver-new .cache/buildx/unoserver

      # - name: Save Buildx cache
      #   if: >-
      #     success() && steps.cache-buildx-restore.outputs.cache-hit != 'true' &&
      #     (github.event_name != 'pull_request' ||
      #      github.event.pull_request.head.repo.full_name == github.repository)
      #   uses: Ludy87/cache-the-planet/save@v1
      #   with:
      #     repository: Ludy87/spdf-cache
      #     encryption-key: ${{ secrets.CACHE_APP_TOKEN }}
      #     path: .cache/buildx/unoserver
      #     cache-name: buildx-unoserver
      #     key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('docker/unoserver/Dockerfile', 'docker/unoserver/fonts.conf', 'docker/unoserver/entrypoint.sh', 'docker/unoserver/healthcheck.sh', '.dockerignore')) }}
      #     token: ${{ secrets.CACHE_APP_TOKEN }}
      #     exclude: |
      #       **/.env
      #       **/*.pem
      #       **/*credentials*

  gradle-cache-prime:
    environment:
      name: ci-unsigned
      deployment: false
    name: Prime shared Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # - name: Cache Gradle (lookup-only)
      #   id: cache
      #   uses: Ludy87/cache-the-planet@v1
      #   with:
      #     repository: Ludy87/spdf-cache
      #     encryption-key: ${{ secrets.CACHE_APP_TOKEN }}
      #     path: |
      #       .cache/gradle/caches
      #       .cache/gradle/wrapper
      #     cache-name: gradle
      #     key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'buildSrc/**', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle')) }}
      #     token: ${{ secrets.CACHE_APP_TOKEN }}

      - name: Report Gradle cache result
        run: |
          echo "Exact hit: ${{ steps.cache.outputs.cache-hit }}"
          echo "Matched key: ${{ steps.cache.outputs.matched-key }}"
          echo "Object: ${{ steps.cache.outputs.content-hash }}"

      - name: Set up JDK 25
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Resolve backend dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew :stirling-pdf:classes --no-daemon
        env:
          STIRLING_FLAVOR: saas
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}

      # - name: Save cache Gradle User Home
      #   if: >-
      #     success() && steps.cache.outputs.cache-hit != 'true' &&
      #     (github.event_name != 'pull_request' ||
      #      github.event.pull_request.head.repo.full_name == github.repository)
      #   uses: Ludy87/cache-the-planet/save@v1
      #   with:
      #     repository: Ludy87/spdf-cache
      #     encryption-key: ${{ secrets.CACHE_APP_TOKEN }}
      #     path: |
      #       .cache/gradle/caches
      #       .cache/gradle/wrapper
      #     cache-name: gradle
      #     key: ${{ format('{0}-{1}/{2}/v1', runner.os, runner.arch, hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'buildSrc/**', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle')) }}
